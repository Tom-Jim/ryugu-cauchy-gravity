[package]
name = "rtfp-bake"
version = "0.1.0"
edition = "2021"
description = "Native RT-FP bake: analytic polyhedral near-field + ray-traced deviation quadrature"
license = "MIT"
readme = "../../README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
wgpu = "30"

[features]
default = []
# Link the vendored ESA polyhedral-gravity library, which `--selftest` uses as an
# independent closed-form reference. It requires a local C++ checkout:
#   bun run esa:configure && bun run bakes:build
# Neither solver needs it, so a bare checkout builds and tests without it.
esa = []

[dev-dependencies]

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"

[profile.dev]
opt-level = 2
