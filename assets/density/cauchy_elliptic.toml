# =============================================================================
# Ryugu Cauchy Cross Model (Calibrated Mean Density & Frontal +Z Cruciform Anomaly)
#
# rho(y) = sum_k w_k * [1 + sigma_k^2 ||y - c_k||^2]^(-alpha_k)
#
# Features:
# 1. Frontal cruciform Cauchy density anomaly facing the camera (+Z face, c_z ~ 0.43 km),
#    with vertical arm along Y in [-0.36, +0.36] and horizontal arm along X in [-0.36, +0.36].
# 2. Side cruciform Cauchy density anomaly on +X face.
# 3. Explicit mean_density = 1190.0 calibrated to the enclosed volume of Ryugu
#    via divergence-theorem volume integration.
# =============================================================================
type = "arbitrary_density_cauchy_mixture"
alpha_default = 1.0
model_id = "ryugu_cauchy_cross_v2"
mean_density = 1190.0
bulk_density_ref = 1190.0
total_mass_target = 4.50e11
homogeneous = false
design_goal = "high_contrast_cruciform_feature_on_surface"
notes = "Calibrated cruciform Cauchy density anomaly on the +Z frontal face producing a prominent cross in the gravity gradient (H) colormap."

