# =============================================================================
# Ryugu Cauchy density — subterranean ore-vein hypothesis (RT-FP)
# =============================================================================
# Design intent (NOT a Hayabusa2 inversion product):
#   Assume dense underground mineral veins (矿脉). Place them so the gravity
#   gradient (Hessian) along the equatorial belt is extremely uniform —
#   i.e. weak longitudinal variation of ‖H‖_F near the equator / ridge.
#
# Mechanism:
#   1) Soft under-dense core + mid-mantle set a smooth radial background.
#   2) A nearly axisymmetric SUBSURFACE EQUATORIAL VEIN RING (high-w, mid σ)
#      dominates equatorial mass — flattens azimuthal gradient scatter.
#   3) Paired antipodal vein segments cancel tesseral / sectoral leakage.
#   4) Polar & small-scale clutter kept weak so they do NOT break equatorial
#      gradient uniformity.
#
# ρ(y) = Σ_k w_k [1 + σ_k² ‖y − c_k‖² ]^(−α_k)
# Length: km. w: kg/m³. M_target keeps Ryugu mass scale.
# =============================================================================

type = "cauchy_kernels"
alpha_default = 1.0
model_id = "ryugu_ore_vein_eq_gradient_uniform_v1"
total_mass_target = 4.50e11
bulk_density_ref = 1190.0
rock_density_ref = 1420.0
ore_density_ref = 2800.0
homogeneous = false
design_goal = "equatorial_gravity_gradient_uniformity"
notes = "Hypothetical ore-vein ring under the equator to homogenize equatorial Hessian; not an observationally unique interior."

[units]
length = "km"
density = "kg/m3"
mass = "kg"

# -----------------------------------------------------------------------------
# L0 — Smooth radial background (no flat uniform fill; still non-uniform)
# Soft mantle + core deficit → radial structure without strong longitude noise.
# -----------------------------------------------------------------------------
[[kernels]]
role = "L0_mantle_smooth"
c = [0.0, 0.0, 0.0]
sigma = 0.28
w = 720.0
alpha = 1.0

[[kernels]]
role = "L0_mantle_outer"
c = [0.0, 0.0, 0.0]
sigma = 0.38
w = 280.0
alpha = 1.0

[[kernels]]
