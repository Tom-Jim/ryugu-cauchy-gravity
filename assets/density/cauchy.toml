# =============================================================================
# Ryugu density model — 12-fold equatorial ore belt over a light, stratified
# interior. DESIGNED FIELD, not a Hayabusa2 inversion product.
# =============================================================================
# ρ(y) = Σ_k w_k · [1 + σ_k² ‖y − c_k‖²]^(−α_k),   α_k = 1
# Lengths km, weights kg/m³. The field is analytic, so a solver can either
# integrate it in closed form along the rays of an observation point (the RT-FP
# solver) or represent it by its jump surfaces (the Carlson solver).
#
# WHY THIS SHAPE
# --------------
# Three solvers are compared on the same field:
#
#   * Werner / ESA polyhedral — closed form for *uniform* density,
#   * RT-FP — closed form in the radial direction for the kernel family above,
#     with the remaining direction integral done by quadrature,
#   * Carlson — the density written as jump surfaces over a star-cone
#     decomposition, evaluated as a pure surface integral,
#   * mascon — the same density sampled onto a 192³ grid of point masses.
#
# The first three resolve the density at the mesh's own ~1.5 m faces; mascon
# resolves it at its 5.2 m voxels. A field whose density varies mainly *along*
# a radius-from-the-centroid ray is therefore the honest stress case: it is what
# separates a surface-integral solver (whose only error is the representation of
# ρ inside one cell) from a volumetric direct sum.
#
# The construction follows that directly:
#
#   1. a nearly uniform matrix, so every other layer is measured against a flat
#      background rather than against another smooth radial profile;
#   2. a very light core, which is the only strongly radial feature and is
#      deliberately small;
#   3. the PRIMARY feature — 12 radial ore chains at 72 m · 4 = 288 m of
#      longitude-locked radius, i.e. an equatorial belt that is high-contrast in
#      *direction* while its own along-ray profile stays close to a plateau;
#   4. a thin regolith deficit above the belt, mid-latitude compensation mass and
#      polar deficits, so the field is genuinely three-dimensional.
#
# The amplitudes are chosen so the density varies by roughly 15 % along any ray
# from the volume centroid to the surface. That number matters: a jump-surface
# solver pays O(Δρ_cell/ρ) for the variation left inside a cell, and every
# Carlson bake prints the tolerance it achieved, so the field can always be
# checked against the accuracy it claims rather than assumed from the plot.
#
# NORMALISATION
# -------------
# The weights below are rescaled at load time so ∫ρ dV equals `total_mass_target`
# (the Ryugu mass scale), using the divergence-theorem volume integral in
# `bakes/rtfp/src/mass.rs`. Every record on disk — Werner, mascon, RT-FP and
# Carlson — is on that same mass budget, so a residual face-by-face gap is
# algorithm or discretisation, never bookkeeping. The alternative convention
# (ρ(0) = bulk_density_ref) is computed and printed by every bake, so the two can
# never be silently confused again.
# =============================================================================

type = "cauchy_kernels"
alpha_default = 1.0
model_id = "ryugu_equatorial_ore_belt_v2"
total_mass_target = 4.50e11
bulk_density_ref = 1190.0
rock_density_ref = 1420.0
ore_density_ref = 2800.0
homogeneous = false
design_goal = "directional_contrast_with_low_radial_variation"
notes = "Designed stress case for arbitrary-density solvers: 12-fold equatorial ore belt over a light stratified interior. Not an observationally unique interior."

kernels = [
  # ---------------------------------------------------------------------------
  # L0 — Reference matrix. σ → 0 makes this an almost exactly uniform fill.
  # ---------------------------------------------------------------------------
  { role = "L0_matrix_uniform", c = [0.0000, 0.0000, 0.0000], sigma = 0.02, w = 1000.0 },

  # ---------------------------------------------------------------------------
  # L1 — Light core. One broad kernel only: a compact core would put a narrow
  # radial step into every ray, which is exactly the structure a jump-surface
  # solver cannot afford to resolve and a voxel grid can.
  # ---------------------------------------------------------------------------
  { role = "L1_core_broad", c = [0.0000, 0.0000, 0.0000], sigma = 3.0, w = 20.0 },

  # ---------------------------------------------------------------------------
  # L1b — Hub compensation. Every longitude's inner lane sits the same distance
  # from the centroid, so their sum piles up on the axis and would put a crest at
  # the centre of every ray. This one negative kernel flattens that crest. Its
  # mass is irrelevant: the weights are renormalised to the target total mass.
  # ---------------------------------------------------------------------------
  { role = "L1b_hub_compensation", c = [0.0000, 0.0000, 0.0000], sigma = 7.0, w = -45.0 },

  # ---------------------------------------------------------------------------
  # L2 — PRIMARY FEATURE: equatorial ore belt.
  # 12 longitudes × 3 radial lanes (120 m, 180 m, 240 m), σ = 10 km⁻¹.
  # Lane spacing 60 m against a 100 m kernel scale makes the three lanes overlap
  # into a continuous radial column, so the belt is a strong function of
  # direction and only a weak function of radius.
  # ---------------------------------------------------------------------------
  { role = "L2_belt_000_r120", c = [0.1200, 0.0000, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_030_r120", c = [0.1039, 0.0600, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_060_r120", c = [0.0600, 0.1039, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_090_r120", c = [0.0000, 0.1200, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_120_r120", c = [-0.0600, 0.1039, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_150_r120", c = [-0.1039, 0.0600, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_180_r120", c = [-0.1200, 0.0000, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_210_r120", c = [-0.1039, -0.0600, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_240_r120", c = [-0.0600, -0.1039, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_270_r120", c = [0.0000, -0.1200, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_300_r120", c = [0.0600, -0.1039, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_330_r120", c = [0.1039, -0.0600, 0.0], sigma = 10.0, w = 35.0 },

  { role = "L2_belt_000_r180", c = [0.1800, 0.0000, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_030_r180", c = [0.1559, 0.0900, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_060_r180", c = [0.0900, 0.1559, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_090_r180", c = [0.0000, 0.1800, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_120_r180", c = [-0.0900, 0.1559, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_150_r180", c = [-0.1559, 0.0900, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_180_r180", c = [-0.1800, 0.0000, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_210_r180", c = [-0.1559, -0.0900, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_240_r180", c = [-0.0900, -0.1559, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_270_r180", c = [0.0000, -0.1800, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_300_r180", c = [0.0900, -0.1559, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_330_r180", c = [0.1559, -0.0900, 0.0], sigma = 10.0, w = 35.0 },

  { role = "L2_belt_000_r240", c = [0.2400, 0.0000, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_030_r240", c = [0.2078, 0.1200, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_060_r240", c = [0.1200, 0.2078, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_090_r240", c = [0.0000, 0.2400, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_120_r240", c = [-0.1200, 0.2078, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_150_r240", c = [-0.2078, 0.1200, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_180_r240", c = [-0.2400, 0.0000, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_210_r240", c = [-0.2078, -0.1200, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_240_r240", c = [-0.1200, -0.2078, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_270_r240", c = [0.0000, -0.2400, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_300_r240", c = [0.1200, -0.2078, 0.0], sigma = 10.0, w = 35.0 },
  { role = "L2_belt_330_r240", c = [0.2078, -0.1200, 0.0], sigma = 10.0, w = 35.0 },

  # ---------------------------------------------------------------------------
  # L3 — Ridge regolith deficit directly above the belt: the equatorial column
  # is stratified (ore under rubble) instead of uniformly dense.
  # ---------------------------------------------------------------------------
  { role = "L3_regolith_000", c = [0.3000, 0.0000, 0.0], sigma = 10.0, w = -15.0 },
  { role = "L3_regolith_030", c = [0.2598, 0.1500, 0.0], sigma = 10.0, w = -15.0 },
  { role = "L3_regolith_060", c = [0.1500, 0.2598, 0.0], sigma = 10.0, w = -15.0 },
  { role = "L3_regolith_090", c = [0.0000, 0.3000, 0.0], sigma = 10.0, w = -15.0 },
