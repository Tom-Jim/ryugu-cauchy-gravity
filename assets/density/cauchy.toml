# =============================================================================
# Ryugu density model — an angularly structured interior carrying two true
# density discontinuities: a narrow core-mantle step and discrete ore bodies and
# voids. DESIGNED FIELD, not a Hayabusa2 inversion product.
# =============================================================================
# rho(y) = sum_k w_k * [1 + sigma_k^2 ||y - c_k||^2]^(-alpha_k),  alpha_k = 1
# Lengths km, weights kg/m^3. The field is analytic, so a solver can either
# integrate it in closed form along the rays of an observation point (the RT-FP
# solver) or represent it by its jump surfaces (the Carlson solver).
#
# WHY THIS SHAPE
# --------------
# Four solvers are compared on the same field:
#
#   * Werner / ESA polyhedral — closed form for *uniform* density,
#   * RT-FP — closed form in the radial direction for the kernel family above,
#     with the remaining direction integral done by quadrature,
#   * Carlson — the density written as jump surfaces over a star-cone
#     decomposition, evaluated as a pure surface integral,
#   * mascon — the same density sampled onto a 192^3 grid of point masses.
#
# The design rule is the one the four algorithms disagree about. Carlson writes
# the cone from the volume centroid to each mesh face and resolves the density
# along that cone's *axis*, so angular structure costs it nothing (a cone spans
# one mesh face, ~2 m at the surface) while radial structure costs slabs, and the
# slab budget is finite. RT-FP integrates the radial direction in closed form and
# only quadratures the remaining direction integral with 288 fixed directions,
# so radial structure costs it nothing while angular structure must stay smooth
# on the ~0.2 rad scale of that quadrature. A field that is fair to both, and
# adversarial to a voxel grid, therefore has to put almost all of its variation
# in *direction*:
#
#   1. L0-L1 — a nearly uniform matrix, plus the hub compensation that keeps the
#      sum of the belt lanes from piling up on the axis. The radial profile stays
#      within ~15 % of the bulk density, so a cone axis is nearly isopycnic.
#   2. L2 — the primary feature: a 12-fold equatorial ore belt of three radial
#      lanes, sigma = 10 km^-1 (a ~100 m kernel). Coarse enough for the 288
#      direction quadrature, 12-fold in longitude so the mesh resolves it.
#   3. L3-L5 — a regolith deficit above the belt, polar deficits and a
#      mid-latitude compensation: the field is genuinely three-dimensional, and
#      every one of those features is a function of direction.
#   4. L6 — a *sharp* core-mantle step (sigma = 45 km^-1, a ~22 m transition) and
#      two pairs of discrete ore bodies and voids. These are the true
#      discontinuities of the model: a jump-surface representation is supposed to
#      carry them directly, and their amplitudes are kept small enough that the
#      cone-axis variation they add stays inside Carlson's slab budget.
#
# The L6 discontinuities are the reason this layout replaced an earlier one built
# around a factor-of-four radial stratification. That stratification was measured
# to be *worse* for every solver at a 16 m observation surface: it pushed
# Carlson's worst within-cone slab variation to 0.119 of rho(centroid) — its
# slab budget is what limits that error, not its formulation — while leaving the
# voxel solver's own residual essentially unchanged, because mascon's 16 m error
# is set by the voxel near field, not by how the density is parameterised. See
# `docs/MEASUREMENTS.local.md` for both data sets.
#
# NORMALISATION
# -------------
# The weights below are rescaled at load time so that the integral of rho over
# the body equals `total_mass_target` (the Ryugu mass scale), using the
# divergence-theorem volume integral in `bakes/rtfp/src/mass.rs`. Every record on
# disk — Werner, mascon, RT-FP and Carlson — is on that same mass budget, so a
# residual face-by-face gap is algorithm or discretisation, never bookkeeping.
# The alternative convention (rho(0) = bulk_density_ref) is computed and printed
# by every bake so that the two can never be silently confused.
# =============================================================================

type = "cauchy_kernels"
alpha_default = 1.0
model_id = "ryugu_angular_ore_belt_with_core_step_v4"
total_mass_target = 4.50e11
bulk_density_ref = 1190.0
rock_density_ref = 1420.0
ore_density_ref = 2800.0
homogeneous = false
design_goal = "directional_contrast_with_true_density_discontinuities"
notes = "Designed stress case for arbitrary-density solvers: a 12-fold equatorial ore belt over a near-uniform matrix, plus a narrow core-mantle step and discrete ore bodies and voids. Not an observationally unique interior."

kernels = [
  # ---------------------------------------------------------------------------
  # L0 — Reference matrix. sigma -> 0 makes this an almost exactly uniform fill,
  # so every other layer is measured against a flat background.
  # ---------------------------------------------------------------------------
  { role = "L0_matrix_uniform", c = [0.0000, 0.0000, 0.0000], sigma = 0.02, w = 1000.0 },

  # ---------------------------------------------------------------------------
  # L1 — Broad core and hub compensation. One broad kernel only: a compact core
  # would put a narrow radial step into every cone axis, which is exactly the
  # structure a jump-surface solver has to pay slabs for.
  #
  # The compensation kernel exists because every longitude's inner lane sits the
  # same distance from the centroid, so their sum piles up on the axis. Its mass
  # is irrelevant: the weights are renormalised to the target total mass.
  # ---------------------------------------------------------------------------
  { role = "L1_core_broad", c = [0.0000, 0.0000, 0.0000], sigma = 3.0, w = 20.0 },
  { role = "L1b_hub_compensation", c = [0.0000, 0.0000, 0.0000], sigma = 7.0, w = -45.0 },

  # ---------------------------------------------------------------------------
  # L2 — PRIMARY FEATURE: equatorial ore belt.
  # 12 longitudes x 3 radial lanes (120 m, 180 m, 240 m), sigma = 10 km^-1.
  # Lane spacing 60 m against a 100 m kernel scale makes the three lanes overlap
  # into a continuous radial column, so the belt is a strong function of
  # direction and only a weak function of radius.
  # ---------------------------------------------------------------------------
  { role = "L2_belt_000_r120", c = [0.1200, 0.0000, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_030_r120", c = [0.1039, 0.0600, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_060_r120", c = [0.0600, 0.1039, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_090_r120", c = [0.0000, 0.1200, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_120_r120", c = [-0.0600, 0.1039, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_150_r120", c = [-0.1039, 0.0600, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_180_r120", c = [-0.1200, 0.0000, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_210_r120", c = [-0.1039, -0.0600, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_240_r120", c = [-0.0600, -0.1039, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_270_r120", c = [0.0000, -0.1200, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_300_r120", c = [0.0600, -0.1039, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_330_r120", c = [0.1039, -0.0600, 0.0], sigma = 10.0, w = 50.0 },

  { role = "L2_belt_000_r180", c = [0.1800, 0.0000, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_030_r180", c = [0.1559, 0.0900, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_060_r180", c = [0.0900, 0.1559, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_090_r180", c = [0.0000, 0.1800, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_120_r180", c = [-0.0900, 0.1559, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_150_r180", c = [-0.1559, 0.0900, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_180_r180", c = [-0.1800, 0.0000, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_210_r180", c = [-0.1559, -0.0900, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_240_r180", c = [-0.0900, -0.1559, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_270_r180", c = [0.0000, -0.1800, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_300_r180", c = [0.0900, -0.1559, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_330_r180", c = [0.1559, -0.0900, 0.0], sigma = 10.0, w = 50.0 },

  { role = "L2_belt_000_r240", c = [0.2400, 0.0000, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_030_r240", c = [0.2078, 0.1200, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_060_r240", c = [0.1200, 0.2078, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_090_r240", c = [0.0000, 0.2400, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_120_r240", c = [-0.1200, 0.2078, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_150_r240", c = [-0.2078, 0.1200, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_180_r240", c = [-0.2400, 0.0000, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_210_r240", c = [-0.2078, -0.1200, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_240_r240", c = [-0.1200, -0.2078, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_270_r240", c = [0.0000, -0.2400, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_300_r240", c = [0.1200, -0.2078, 0.0], sigma = 10.0, w = 50.0 },
  { role = "L2_belt_330_r240", c = [0.2078, -0.1200, 0.0], sigma = 10.0, w = 50.0 },

  # ---------------------------------------------------------------------------
  # L3 — Ridge regolith deficit directly above the belt: the equatorial column
  # is stratified (ore under rubble) instead of uniformly dense.
  # ---------------------------------------------------------------------------
  { role = "L3_regolith_000", c = [0.3000, 0.0000, 0.0], sigma = 10.0, w = -22.0 },
  { role = "L3_regolith_030", c = [0.2598, 0.1500, 0.0], sigma = 10.0, w = -22.0 },
  { role = "L3_regolith_060", c = [0.1500, 0.2598, 0.0], sigma = 10.0, w = -22.0 },
  { role = "L3_regolith_090", c = [0.0000, 0.3000, 0.0], sigma = 10.0, w = -22.0 },
  { role = "L3_regolith_120", c = [-0.1500, 0.2598, 0.0], sigma = 10.0, w = -22.0 },
  { role = "L3_regolith_150", c = [-0.2598, 0.1500, 0.0], sigma = 10.0, w = -22.0 },
  { role = "L3_regolith_180", c = [-0.3000, 0.0000, 0.0], sigma = 10.0, w = -22.0 },
  { role = "L3_regolith_210", c = [-0.2598, -0.1500, 0.0], sigma = 10.0, w = -22.0 },
  { role = "L3_regolith_240", c = [-0.1500, -0.2598, 0.0], sigma = 10.0, w = -22.0 },
  { role = "L3_regolith_270", c = [0.0000, -0.3000, 0.0], sigma = 10.0, w = -22.0 },
  { role = "L3_regolith_300", c = [0.1500, -0.2598, 0.0], sigma = 10.0, w = -22.0 },
  { role = "L3_regolith_330", c = [0.2598, -0.1500, 0.0], sigma = 10.0, w = -22.0 },

  # ---------------------------------------------------------------------------
  # L4 — Polar deficits: the field is denser along the equator than towards the
  # poles, so it is not a function of radius alone.
  # ---------------------------------------------------------------------------
  { role = "L4_polar_north", c = [0.0000, 0.0000, 0.2600], sigma = 8.0, w = -26.0 },
  { role = "L4_polar_south", c = [0.0000, 0.0000, -0.2500], sigma = 8.0, w = -26.0 },

  # ---------------------------------------------------------------------------
  # L5 — Mid-latitude compensation mass, axisymmetric: closes the budget the core
  # and the belt opened without adding longitude structure of its own.
  # ---------------------------------------------------------------------------
  { role = "L5_midlat_north", c = [0.0000, 0.0000, 0.1700], sigma = 6.0, w = 22.0 },
  { role = "L5_midlat_south", c = [0.0000, 0.0000, -0.1650], sigma = 6.0, w = 22.0 },

  # ---------------------------------------------------------------------------
  # L6 — True discontinuities. A narrow core-mantle step, and two pairs of
  # discrete ore bodies and voids. sigma = 45 km^-1 gives a ~22 m transition and
  # sigma = 14 km^-1 a ~70 m body; both sit well inside the 5.2 m mascon cell
  # scale, which is the point — a jump surface is the natural description of
  # them, and a voxel grid can only average them into a cell mass.
  # ---------------------------------------------------------------------------
  { role = "L6_core_step", c = [0.0000, 0.0000, 0.0000], sigma = 45.0, w = 210.0 },
  { role = "L6_core_step_comp", c = [0.0000, 0.0000, 0.0000], sigma = 15.0, w = -175.0 },
  { role = "L6_ore_body_a", c = [0.0500, 0.0800, 0.1800], sigma = 14.0, w = 28.0 },
  { role = "L6_ore_body_a_antipode", c = [-0.0500, -0.0800, -0.1800], sigma = 14.0, w = 28.0 },
  { role = "L6_void_a", c = [0.0800, -0.0600, 0.1700], sigma = 14.0, w = -24.0 },
  { role = "L6_void_a_antipode", c = [-0.0800, 0.0600, -0.1700], sigma = 14.0, w = -24.0 },
]
