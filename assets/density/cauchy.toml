  { role = "L3_regolith_180", c = [-0.3000, 0.0000, 0.0], sigma = 10.0, w = -15.0 },
  { role = "L3_regolith_210", c = [-0.2598, -0.1500, 0.0], sigma = 10.0, w = -15.0 },
  { role = "L3_regolith_240", c = [-0.1500, -0.2598, 0.0], sigma = 10.0, w = -15.0 },
  { role = "L3_regolith_270", c = [0.0000, -0.3000, 0.0], sigma = 10.0, w = -15.0 },
  { role = "L3_regolith_300", c = [0.1500, -0.2598, 0.0], sigma = 10.0, w = -15.0 },
  { role = "L3_regolith_330", c = [0.2598, -0.1500, 0.0], sigma = 10.0, w = -15.0 },

  # ---------------------------------------------------------------------------
  # L4 — Polar deficits: the field is denser along the equator than towards the
  # poles, so it is not a function of radius alone.
  # ---------------------------------------------------------------------------
  { role = "L4_polar_north", c = [0.0000, 0.0000, 0.2600], sigma = 8.0, w = -18.0 },
  { role = "L4_polar_south", c = [0.0000, 0.0000, -0.2500], sigma = 8.0, w = -18.0 },

  # ---------------------------------------------------------------------------
  # L5 — Mid-latitude compensation mass, axisymmetric: closes the budget the core
  # and the belt opened without adding longitude structure of its own.
  # ---------------------------------------------------------------------------
  { role = "L5_midlat_north", c = [0.0000, 0.0000, 0.1700], sigma = 6.0, w = 15.0 },
  { role = "L5_midlat_south", c = [0.0000, 0.0000, -0.1650], sigma = 6.0, w = 15.0 },

  # ---------------------------------------------------------------------------
  # L6 — Sparse micro clasts and voids. Deliberately weak: they keep the field
  # from being analytically trivial at small scale without moving the result.
  # ---------------------------------------------------------------------------
  { role = "L6_void_a", c = [0.0500, 0.0800, 0.1800], sigma = 14.0, w = -10.0 },
  { role = "L6_void_a_antipode", c = [-0.0500, -0.0800, -0.1800], sigma = 14.0, w = -10.0 },
  { role = "L6_clast_a", c = [0.0800, -0.0600, 0.1700], sigma = 14.0, w = 12.0 },
  { role = "L6_clast_a_antipode", c = [-0.0800, 0.0600, -0.1700], sigma = 14.0, w = 12.0 },
]
