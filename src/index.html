<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Ryugu</title>
  <style>
    html, body { margin: 0; height: 100%; background: #050508; overflow: hidden; }
    #bevy { width: 100%; height: 100%; display: block; touch-action: none; }
    #msg {
      display: none; place-items: center; height: 100%; color: #e8e8ef;
      font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; padding: 2rem; text-align: center;
    }
    #algo-bar {
      position: fixed; top: 1rem; right: 1rem; z-index: 30;
      display: flex; gap: 0.5rem; align-items: center;
    }
    #algo-label {
      padding: 0.4rem 0.7rem; border-radius: 8px;
      background: rgba(12, 12, 18, 0.82); color: rgba(232,232,239,0.72);
      font: 600 11px/1.2 ui-sans-serif, system-ui, sans-serif;
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
    }
    #algo-btn {
      appearance: none; border: 0; border-radius: 8px; cursor: pointer;
      padding: 0.45rem 0.85rem;
      font: 600 12px/1.2 ui-sans-serif, system-ui, sans-serif;
      color: #0b0b10; background: #9eb6d4;
    }
    #panel {
      position: fixed; left: 1rem; right: 1rem; bottom: 1rem; z-index: 20;
      max-width: 420px; padding: 0.85rem 1rem; border-radius: 10px;
      background: rgba(12, 12, 18, 0.88); color: #e8e8ef;
      font: 13px/1.4 ui-sans-serif, system-ui, sans-serif;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    #panel[hidden] { display: none !important; }
    #panel h1 {
      margin: 0 0 0.55rem; font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
      color: rgba(232,232,239,0.75);
    }
    .row { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
    #bake-btn, #resume-btn {
      appearance: none; border: 0; border-radius: 8px; cursor: pointer;
      padding: 0.45rem 0.85rem; font: 600 12px/1.2 ui-sans-serif, system-ui, sans-serif;
    }
    #bake-btn { color: #0b0b10; background: #e8b86d; }
    #resume-btn { color: #0b0b10; background: #7ec8a3; }
    #bake-btn:disabled, #resume-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    #reload-btn {
      appearance: none; border: 1px solid rgba(255,255,255,0.18); border-radius: 8px;
      cursor: pointer; padding: 0.45rem 0.75rem;
      font: 600 12px/1.2 ui-sans-serif, system-ui, sans-serif;
      color: #e8e8ef; background: transparent;
    }
    #bar {
      margin-top: 0.65rem; height: 8px; border-radius: 999px;
      background: rgba(255,255,255,0.08); overflow: hidden;
    }
    #bar > i {
      display: block; height: 100%; width: 0%; border-radius: inherit;
      background: linear-gradient(90deg, #6b3fa0, #d9488a, #f0a03c);
      transition: width 0.25s ease;
    }
    #status { margin-top: 0.45rem; color: rgba(232,232,239,0.65); font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="bevy"></canvas>
  <div id="msg"></div>
  <div id="algo-bar">
    <span id="algo-label">Werner 常密度</span>
    <button id="algo-btn" type="button">切换算法</button>
  </div>
  <div id="panel">
    <h1>Werner 常密度 · 全网格逐面重力梯度</h1>
    <div class="row">
      <button id="bake-btn" type="button">重新计算</button>
      <button id="resume-btn" type="button" hidden>继续计算</button>
      <button id="reload-btn" type="button" hidden>刷新着色</button>
    </div>
    <div id="bar"><i id="bar-fill"></i></div>
    <div id="status">读取状态…</div>
  </div>
  <script type="module">
    const ALGO_KEY = "ryugu_algo";
    const msg = document.getElementById("msg");
    const panel = document.getElementById("panel");
    const algoBtn = document.getElementById("algo-btn");
    const algoLabel = document.getElementById("algo-label");
    const bakeBtn = document.getElementById("bake-btn");
    const resumeBtn = document.getElementById("resume-btn");
    const reloadBtn = document.getElementById("reload-btn");
    const barFill = document.getElementById("bar-fill");
    const statusEl = document.getElementById("status");

    function getAlgo() {
      const q = new URLSearchParams(location.search).get("algo");
      if (q === "model" || q === "werner") return q;
      const saved = localStorage.getItem(ALGO_KEY);
      return saved === "model" || saved === "werner" ? saved : "werner";
    }

    function switchAlgo() {
      const next = getAlgo() === "werner" ? "model" : "werner";
      localStorage.setItem(ALGO_KEY, next);
      const u = new URL(location.href);
      u.searchParams.set("algo", next);
      location.assign(u.toString());
    }

    const algo = getAlgo();
    localStorage.setItem(ALGO_KEY, algo);
    const isWerner = algo === "werner";
    algoLabel.textContent = isWerner ? "Werner 常密度" : "模型展示";
    algoBtn.textContent = isWerner ? "切换到模型展示" : "切换到 Werner 常密度";
    panel.hidden = !isWerner;
    algoBtn.addEventListener("click", switchAlgo);

    const show = (t) => {
      document.getElementById("bevy").hidden = true;
      msg.style.display = "grid";
      msg.textContent = t;
      console.error(t);
    };
    window.addEventListener("unhandledrejection", (e) => {
      const r = String(e.reason || "");
      if (/WebGPU|wasm|Failed to fetch dynamically|Importing a module/.test(r)) show(r);
      else console.warn(e.reason);
    });

    function renderStatus(s) {
      if (!isWerner) return;
      const pct = Math.max(0, Math.min(100, Number(s.percent) || 0));
      barFill.style.width = `${pct}%`;
      let line = s.message || s.state;
      if (s.total > 0) line += ` · ${pct.toFixed(1)}%`;
      if (s.error) line += ` · ${s.error}`;
      statusEl.textContent = line;
      const running = s.state === "running";
      bakeBtn.disabled = running;
      bakeBtn.textContent = running ? "计算中…" : "重新计算";
      resumeBtn.hidden = !(s.canResume && !running);
      resumeBtn.disabled = running || !s.canResume;
      reloadBtn.hidden = s.state !== "done";
    }

    async function startBake(mode) {
      const label = mode === "resume" ? "继续" : "重新";
      bakeBtn.disabled = true;
      resumeBtn.disabled = true;
      statusEl.textContent = mode === "resume"
        ? "正在从记录恢复并继续计算…"
        : "正在清空记录并重新计算…";
      try {
        const s = await (await fetch("/api/bake/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mode }),
        })).json();
        renderStatus(s);
      } catch (e) {
        statusEl.textContent = `${label}计算启动失败: ${e}`;
        bakeBtn.disabled = false;
        resumeBtn.disabled = false;
      }
    }

    async function pollStatus() {
      if (!isWerner) return null;
      try {
        const s = await (await fetch("/api/bake/status", { cache: "no-store" })).json();
        renderStatus(s);
        return s;
      } catch (e) {
        statusEl.textContent = `状态读取失败: ${e}`;
        return null;
      }
    }

    async function pullBakeIntoWasm(wasm) {
      try {
        const bakeRes = await fetch(`/assets/gradient_faces.bin?t=${Date.now()}`, {
          cache: "no-store",
        });
        if (!bakeRes.ok) return;
        const bakeBytes = new Uint8Array(await bakeRes.arrayBuffer());
        if (bakeBytes.byteLength >= 28) wasm.push_bake_update(bakeBytes);
      } catch {
        /* ignore transient read while writer truncates */
      }
    }

    if (isWerner) {
      bakeBtn.addEventListener("click", () => startBake("restart"));
      resumeBtn.addEventListener("click", () => startBake("resume"));
      reloadBtn.addEventListener("click", () => location.reload());
      setInterval(pollStatus, 1000);
      await pollStatus();
    }

    if (!navigator.gpu) {
      show("需要 WebGPU");
    } else {
      try {
        const wasm = await import("/pkg/ryugu_h_cal.js");
        await wasm.default({ module_or_path: "/pkg/ryugu_h_cal_bg.wasm" });
        if (isWerner) {
          let bakeBytes = new Uint8Array(28);
          try {
            const bakeRes = await fetch("/assets/gradient_faces.bin", { cache: "no-store" });
            if (bakeRes.ok) bakeBytes = new Uint8Array(await bakeRes.arrayBuffer());
          } catch {
            /* start gray; bake may create file */
          }
          wasm.run_with_bake(bakeBytes);
          setInterval(() => pullBakeIntoWasm(wasm), 500);
        } else {
          wasm.run_clean();
        }
      } catch (e) {
        show(String(e?.stack || e));
      }
    }
  </script>
</body>
</html>
