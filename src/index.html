<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Ryugu</title>
  <style>
    html, body { margin: 0; height: 100%; background: #050508; overflow: hidden; }
    #bevy { width: 100%; height: 100%; display: block; touch-action: none; }
    #no-webgpu {
      display: none; place-items: center; height: 100%; color: #e8e8ef;
      font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; padding: 2rem; text-align: center;
    }
    #hint {
      position: fixed; left: 1rem; bottom: 1rem; color: rgba(230,230,240,.55);
      font: 12px/1.4 ui-sans-serif, system-ui, sans-serif; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="bevy" aria-label="Ryugu asteroid"></canvas>
  <div id="no-webgpu"><h2>需要 WebGPU</h2><p>请使用支持 WebGPU 的浏览器打开本页。</p></div>
  <div id="hint">拖拽旋转视角 · 滚轮缩放 · 小行星自转中</div>
  <script type="module">
    async function waitForWebGpu() {
      if (!navigator.gpu) return null;
      for (let i = 0; i < 20; i++) {
        try {
          const adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" });
          if (adapter) return adapter;
        } catch { /* retry */ }
        await new Promise((r) => setTimeout(r, 500));
      }
      return null;
    }
    if (!(await waitForWebGpu())) {
      document.getElementById("bevy").hidden = true;
      document.getElementById("no-webgpu").style.display = "grid";
      document.getElementById("hint").hidden = true;
    } else {
      const wasm = await import("/pkg/ryugu_h_cal.js");
      await wasm.default({ module_or_path: "/pkg/ryugu_h_cal_bg.wasm" });
    }
  </script>
</body>
</html>
