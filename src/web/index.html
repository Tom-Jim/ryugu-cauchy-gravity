<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="ryugu-mode" content="dynamic" />
  <link rel="icon" href="data:," />
  <title>Ryugu · gravity-gradient face records</title>
  <style>
    html, body { margin: 0; height: 100%; background: #050508; color: #e8e6e3; font-family: ui-sans-serif, system-ui, sans-serif; }
    #bevy { width: 100%; height: 100%; display: block; touch-action: none; }
    #msg { display: none; place-items: center; position: fixed; inset: 0; padding: 2rem; text-align: center; background: rgba(5,5,8,.72); z-index: 5; }
    #algo-bar {
      position: fixed; top: 1rem; right: 1rem; z-index: 4;
      display: flex; gap: .5rem; align-items: center;
      background: rgba(12,12,18,.82); border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; padding: .45rem .6rem .45rem .8rem;
      backdrop-filter: blur(8px); font-size: 12px;
    }
    #algo-btn {
      border: 0; border-radius: 8px; padding: .35rem .7rem; cursor: pointer;
      color: #0b0b10; background: #9bb7ff; font-weight: 650;
    }
    #panel {
      position: fixed; left: 1rem; bottom: 1rem; z-index: 3;
      width: min(460px, calc(100vw - 2rem));
      background: rgba(12,12,18,.82); border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px; padding: .85rem 1rem; backdrop-filter: blur(8px);
    }
    #panel h1 { margin: 0 0 .55rem; font-size: 14px; font-weight: 650; letter-spacing: .02em; }
    #panel .row { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .55rem; }
    #bake-btn, #resume-btn, #reload-btn, #dens-btn {
      border: 0; border-radius: 8px; padding: .4rem .75rem; cursor: pointer; font-weight: 650; font-size: 12px;
    }
    #bake-btn { color: #0b0b10; background: #e8b86d; }
    #resume-btn { color: #0b0b10; background: #7ec8a3; }
    #reload-btn { color: #e8e6e3; background: rgba(255,255,255,.12); }
    #dens-btn { color: #0b0b10; background: #b8a0ff; }
    #bake-btn:disabled, #resume-btn:disabled, #dens-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    #bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin-bottom: .45rem; }
    #bar-fill { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6b4cff, #ff7a59); }
    #status { font-size: 12px; opacity: .9; line-height: 1.35; }
    #compare { margin-top: .45rem; font-size: 12px; opacity: .92; line-height: 1.4; white-space: pre-line; }
    #standoff {
      position: fixed; top: 50%; right: 1rem; transform: translateY(-50%); z-index: 4;
      display: flex; flex-direction: column; align-items: center; gap: .45rem;
      background: rgba(12,12,18,.82); border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; padding: .6rem .5rem; backdrop-filter: blur(8px);
      font-size: 11px; color: #e8e6e3;
    }
    #standoff-val { font-weight: 650; font-variant-numeric: tabular-nums; }
    #standoff-range {
      writing-mode: vertical-lr; direction: rtl;
      width: 22px; height: 220px; margin: 0; accent-color: #9bb7ff; cursor: pointer;
    }
    #standoff-record { font-size: 10px; opacity: .68; white-space: nowrap; }
    #standoff-title { font-size: 10px; opacity: .68; }
  </style>
</head>
<body>
  <canvas id="bevy"></canvas>
  <div id="msg"></div>
  <div id="algo-bar">
    <span id="algo-label">Werner · uniform density</span>
    <button id="algo-btn" type="button">Next algorithm</button>
  </div>
  <div id="standoff">
    <span id="standoff-val">16.00 m</span>
    <input id="standoff-range" type="range" min="0" max="1000" step="1" value="0"
           aria-label="Observation-surface height above the surface (mm)" />
    <span id="standoff-title">Observation height</span>
    <span id="standoff-record"></span>
  </div>
  <div id="panel">
    <h1>Werner · uniform density</h1>
    <div class="row">
      <button id="bake-btn" type="button">Recompute</button>
      <button id="resume-btn" type="button" hidden>Resume</button>
      <button id="dens-btn" type="button" hidden>Switch to uniform density</button>
      <button id="reload-btn" type="button" hidden>Reload colours</button>
    </div>
    <div id="bar"><i id="bar-fill"></i></div>
    <div id="status">Reading status…</div>
    <div id="compare" hidden></div>
  </div>
  <script type="module">
    const STATIC_DEMO =
      document.querySelector('meta[name="ryugu-mode"]')?.content === "static";

    // ---------------------------------------------------------------------
    // Element handles
    // ---------------------------------------------------------------------
    const msg = document.getElementById("msg");
    const algoBtn = document.getElementById("algo-btn");
    const algoLabel = document.getElementById("algo-label");
    const panelTitle = document.querySelector("#panel h1");
    const bakeBtn = document.getElementById("bake-btn");
    const resumeBtn = document.getElementById("resume-btn");
    const densBtn = document.getElementById("dens-btn");
    const reloadBtn = document.getElementById("reload-btn");
    const barFill = document.getElementById("bar-fill");
    const statusEl = document.getElementById("status");
    const compareEl = document.getElementById("compare");
    const standoffRange = document.getElementById("standoff-range");
    const standoffVal = document.getElementById("standoff-val");
    const standoffRecord = document.getElementById("standoff-record");

    // ---------------------------------------------------------------------
    // Observation-surface height
    //
    // Two useful bands sit four orders of magnitude apart: the exact solvers
    // (Werner, RT-FP, Carlson) are still sharp at 1 mm, whereas mascon is a
    // direct sum over 5.253 m voxels and collapses there. A single linear track
    // cannot address both, so *every* algorithm is given the same two-segment
    // vertical slider:
    //
    //   lower half (track 0…500)    →     1 mm …   500 mm
    //   upper half (track 500…1000) →   1 m    …    32 m
    //
    // The slider position is stored, never millimetres; `standoffMm` remains
    // the single source of truth and `posToMm` / `mmToPos` are exact inverses
    // inside each half.
    //
    // Every algorithm starts at the same height (16 m) so that the face-by-face
    // comparison below isolates the solver, not the sampling surface.
    // ---------------------------------------------------------------------
    const STANDOFF_LOW_MM = { min: 1, max: 500 };
    const STANDOFF_HIGH_MM = { min: 1000, max: 32000 };
    const STANDOFF_POS_MAX = 1000;
    const STANDOFF_POS_SPLIT = STANDOFF_POS_MAX / 2;
    const STANDOFF_MIN_MM = STANDOFF_LOW_MM.min;
    const STANDOFF_MAX_MM = STANDOFF_HIGH_MM.max;
    /** Shared start height (mm) — identical for every algorithm. */
    const STANDOFF_DEFAULT_MM = 16000;
    let standoffMm = STANDOFF_DEFAULT_MM;
    let standoffDragging = false;
    // After a manual height change the record on disk is stale for a moment:
    // the sweep restarts a frame later, and a checkpoint queued just before the
    // change may land after the clear. Do not let it drag the slider back.
    let standoffHoldUntil = 0;

    const clampStandoff = (mm) => {
      const v = Number(mm);
      if (!Number.isFinite(v)) return STANDOFF_DEFAULT_MM;
      return Math.min(STANDOFF_MAX_MM, Math.max(STANDOFF_MIN_MM, v));
    };
    const fmtMm = (mm) => (mm >= 1000
      ? `${(mm / 1000).toFixed(2)} m`
      : mm >= 10
        ? `${mm.toFixed(0)} mm`
        : `${mm.toFixed(1)} mm`);
    const lerp = (a, b, t) => a + (b - a) * t;

    /** Slider position (0…1000) → observation height in mm. */
    function posToMm(pos) {
      const p = Math.min(STANDOFF_POS_MAX, Math.max(0, Number(pos) || 0));
      return p <= STANDOFF_POS_SPLIT
        ? lerp(STANDOFF_LOW_MM.min, STANDOFF_LOW_MM.max, p / STANDOFF_POS_SPLIT)
        : lerp(
          STANDOFF_HIGH_MM.min,
          STANDOFF_HIGH_MM.max,
          (p - STANDOFF_POS_SPLIT) / STANDOFF_POS_SPLIT,
        );
    }

    /** Observation height in mm → slider position (0…1000). */
    function mmToPos(mm) {
      const v = clampStandoff(mm);
      if (v <= STANDOFF_LOW_MM.max) {
        return Math.round(lerp(
          0,
          STANDOFF_POS_SPLIT,
          (v - STANDOFF_LOW_MM.min) / (STANDOFF_LOW_MM.max - STANDOFF_LOW_MM.min),
        ));
      }
      const hi = Math.max(v, STANDOFF_HIGH_MM.min);
      return Math.round(lerp(
        STANDOFF_POS_SPLIT,
        STANDOFF_POS_MAX,
        (hi - STANDOFF_HIGH_MM.min) / (STANDOFF_HIGH_MM.max - STANDOFF_HIGH_MM.min),
      ));
    }

    function setStandoffUi(mm) {
      standoffMm = clampStandoff(mm);
      const pos = String(mmToPos(standoffMm));
      if (standoffRange.value !== pos) standoffRange.value = pos;
      standoffVal.textContent = fmtMm(standoffMm);
    }

    function setStandoffRecordLabel(mm) {
      const v = Number(mm);
      standoffRecord.textContent =
        Number.isFinite(v) && v >= STANDOFF_MIN_MM && v <= STANDOFF_MAX_MM
          ? `record ${fmtMm(v)}`
          : "";
    }

    /**
     * Adopt the height a record on disk was computed at, but stay quiet for a
     * moment after a manual change: the previous record is still on disk for a
     * poll or two and would otherwise relabel the new height with the old one.
     */
    function syncStandoffFromRecord(mm) {
      const v = Number(mm);
      if (standoffDragging || Date.now() < standoffHoldUntil) return;
      if (!Number.isFinite(v) || v < STANDOFF_MIN_MM || v > STANDOFF_MAX_MM) return;
      if (Math.abs(v - standoffMm) < 1e-6) return;
      setStandoffUi(v);
    }

    function syncStandoffRecordLabel(mm) {
      if (standoffDragging || Date.now() < standoffHoldUntil) return;
      setStandoffRecordLabel(mm);
    }

    // ---------------------------------------------------------------------
    // Algorithm selection
    //
    // All solvers share one record format (RHGF v5) and one display path, so
    // the page only needs to know the control endpoint, the available density
    // records, and which of them are selectable.
    // ---------------------------------------------------------------------
    const ALGO_KEY = "ryugu_algo";
    const ALGO_ORDER = ["werner", "mascon", "model", "carlson", "carlsonalpha"];
    const ALGOS = {
      werner: {
        name: "Werner",
        short: "Werner · uniform density",
        title: "Werner · uniform density · analytic polyhedral gradient",
        api: "/api/werner",
        asset: "assets/records/gradient_faces.bin",
        compare: false,
        next: "Switch to Mascon (voxel)",
      },
      mascon: {
        name: "Mascon",
        api: "/api/mascon",
        densityModes: ["elliptic", "cauchy"],
        defaultDensity: "elliptic",
        assets: {
          elliptic: "assets/records/mascon_elliptic_faces.bin",
          cauchy: "assets/records/mascon_faces.bin",
        },
        compare: false,
        next: "Switch to RT-FP",
      },
      model: {
        name: "RT-FP",
        api: "/api/rtfp",
        densityModes: ["cauchy", "constant"],
        defaultDensity: "cauchy",
        assets: {
          cauchy: "assets/records/rtfp_faces.bin",
          constant: "assets/records/rtfp_constant_faces.bin",
        },
        compare: true,
        next: "Switch to Carlson",
      },
      carlson: {
        name: "Carlson",
        api: "/api/carlson",
        densityModes: ["cauchy", "constant"],
        defaultDensity: "cauchy",
        assets: {
          cauchy: "assets/records/carlson_cauchy_faces.bin",
          constant: "assets/records/carlson_constant_faces.bin",
        },
        compare: true,
        next: "Switch to CarlsonAlpha",
      },
      carlsonalpha: {
        name: "CarlsonAlpha",
        api: "/api/carlsonalpha",
        densityModes: ["elliptic", "constant"],
        defaultDensity: "elliptic",
        assets: {
          elliptic: "assets/records/carlsonalpha_elliptic_faces.bin",
          constant: "assets/records/carlsonalpha_constant_faces.bin",
        },
        compare: true,
        next: "Switch to Werner",
      },
    };

    function getAlgo() {
      const q = new URLSearchParams(location.search).get("algo");
      if (q && ALGOS[q]) return q;
      const saved = localStorage.getItem(ALGO_KEY);
      return saved && ALGOS[saved] ? saved : "werner";
    }

    let algo = getAlgo();
    localStorage.setItem(ALGO_KEY, algo);
    let cfg = ALGOS[algo];
    let densityMode = cfg.defaultDensity ?? "cauchy";
    let isDensitySelectable = Array.isArray(cfg.densityModes) && cfg.densityModes.length > 1;
    let bakeApi = cfg.api;
    /**
     * Every async read carries the generation it started in. Switching algorithms
     * must never let a late response from the previous record repaint this one.
     */
    let recordGeneration = 0;
    let algoSwitching = false;
    let statusAbort = null;
    let pullAbort = null;
    let pullGeneration = -1;
    let statsGeneration = -1;
    let lastPulledKey = "";
    const recordAsset = () =>
      (isDensitySelectable ? cfg.assets?.[densityMode] : cfg.asset)
      ?? cfg.asset
      ?? Object.values(cfg.assets ?? {})[0];

    async function selectAlgorithm(next) {
      if (!ALGOS[next] || next === algo || algoSwitching) return;

      algoSwitching = true;
      algoBtn.disabled = true;
      recordGeneration++;
      try {
        algo = next;
        cfg = ALGOS[next];
        isDensitySelectable = Array.isArray(cfg.densityModes) && cfg.densityModes.length > 1;
        bakeApi = cfg.api;
        densityMode = cfg.defaultDensity ?? "cauchy";
        compareKey = "";
        window.__bakeScalarStats = null;
        compareEl.hidden = !cfg.compare;
        compareEl.textContent = "";

        localStorage.setItem(ALGO_KEY, algo);
        const u = new URL(location.href);
        u.searchParams.set("algo", algo);
        u.searchParams.delete("fresh");
        // Keep one browser-history entry: Back leaves the viewer instead of
        // restoring the previous algorithm and creating another WebGPU context.
        history.replaceState(null, "", u.toString());

        applyAlgoLabels();
        statusEl.textContent = `Loading ${cfg.name}…`;

        await pollStatus();
      } finally {
        algoSwitching = false;
        algoBtn.disabled = false;
      }
    }

    function switchAlgo() {
      const i = ALGO_ORDER.indexOf(algo);
      const next = ALGO_ORDER[(i + 1) % ALGO_ORDER.length];
      void selectAlgorithm(next);
    }

    setStandoffUi(STANDOFF_DEFAULT_MM);
    algoLabel.textContent = algoShort();
    algoBtn.textContent = cfg.next;
    algoBtn.addEventListener("click", switchAlgo);
    let wasmViewer = null;

    if (STATIC_DEMO) {
      bakeBtn.hidden = true;
      resumeBtn.hidden = true;
      standoffRange.disabled = true;
      standoffRange.title = "The hosted demo uses precomputed records";
    }

    const show = (t) => {
      console.error(t);
      msg.style.display = "grid";
      msg.textContent = t;
    };
    window.addEventListener("unhandledrejection", (e) => {
      console.warn("[unhandledrejection]", String(e.reason || "").slice(0, 500));
    });
    window.addEventListener("error", (e) => {
      console.warn("[window.error]", String(e.message || e.error || "").slice(0, 500));
    });

    // ---------------------------------------------------------------------
    // Status rendering
    // ---------------------------------------------------------------------
    function densityLabel(mode) {
      if (mode === "constant") return "uniform";
      if (mode === "elliptic") return "fractional Cauchy";
      return "Cauchy";
    }

    function algoShort() {
      if (!isDensitySelectable) return cfg.short;
      if (cfg.name === "Mascon") return `Mascon · ${densityLabel(densityMode)} density`;
      if (cfg.name === "RT-FP") {
        return densityMode === "constant"
          ? "RT-FP · uniform density"
          : "RT-FP · Cauchy vein density";
      }
      if (cfg.name === "Carlson") {
        return densityMode === "constant"
          ? "Carlson · uniform density"
          : "Carlson · Cauchy vein density";
      }
      return `CarlsonAlpha · ${densityLabel(densityMode)} density`;
    }

    function algoTitle() {
      if (!isDensitySelectable) return cfg.title;
      if (cfg.name === "Mascon") {
        return densityMode === "elliptic"
          ? "Mascon · 5.2 m voxel direct sum · fractional Cauchy density"
          : "Mascon · 5.2 m voxel direct sum · Cauchy density";
      }
      if (cfg.name === "RT-FP") {
        return densityMode === "constant"
          ? "RT-FP · uniform density ρ₀ · analytic near field only"
          : "RT-FP · Cauchy vein density · analytic near field + GPU quadrature";
      }
      if (cfg.name === "Carlson") {
        return densityMode === "constant"
          ? "Carlson · uniform density · jump-surface surface integral"
          : "Carlson · Cauchy vein density · jump-surface surface integral";
      }
      return densityMode === "constant"
        ? "CarlsonAlpha · uniform density · GPU radial finite part"
        : "CarlsonAlpha · general-α Cauchy · GPU radial finite part";
    }

    function nextDensityMode() {
      const modes = cfg.densityModes ?? [];
      const i = modes.indexOf(densityMode);
      return modes[(i + 1) % modes.length] ?? densityMode;
    }

    function applyAlgoLabels() {
      algoLabel.textContent = algoShort();
      algoBtn.textContent = cfg.next;
      panelTitle.textContent = algoTitle();
      if (isDensitySelectable) {
        densBtn.hidden = false;
        densBtn.textContent = `Switch to ${densityLabel(nextDensityMode())} density`;
      } else {
        densBtn.hidden = true;
      }
    }

    function renderStatus(s) {
      const pct = Math.max(0, Math.min(100, Number(s.percent) || 0));
      barFill.style.width = `${pct}%`;
      let line = s.message || s.state;
      if (s.total > 0) line += ` · ${pct.toFixed(1)}%`;
      if (s.error) line += ` · ${s.error}`;
      if (Number.isFinite(Number(s.standoffMm))) {
        syncStandoffRecordLabel(Number(s.standoffMm));
        syncStandoffFromRecord(Number(s.standoffMm));
      }
      if (window.__bakeScalarStats) {
        const st = window.__bakeScalarStats;
        line += ` · ‖H‖_F min=${st.min} max=${st.max} std/mean=${st.cv}`
          + ` · window [${st.lo}, ${st.hi}] ${st.mode}`;
      }
      statusEl.textContent = line;
      const running = s.state === "running";
      if (STATIC_DEMO) {
        bakeBtn.hidden = true;
        resumeBtn.hidden = true;
      } else {
        bakeBtn.disabled = running;
        bakeBtn.textContent = running ? "Computing…" : "Recompute";
        resumeBtn.hidden = !(s.canResume && !running);
        resumeBtn.disabled = running || !s.canResume;
      }
      reloadBtn.hidden = s.state !== "done";
      if (isDensitySelectable) {
        // The density model lives on the server (it selects the kernel set), so
        // the button label follows the reported status rather than local state.
        if (cfg.densityModes.includes(s.densityMode)) densityMode = s.densityMode;
        applyAlgoLabels();
        densBtn.disabled = running;
        updateAlgorithmCompare(s);
      }
      if (s.state !== "done") window.__bakeScalarStats = null;
    }

    /** Colour-window statistics, so the panel explains what the renderer chose. */
    async function refreshBakeScalarStats(buffer) {
      const generation = recordGeneration;
      if (statsGeneration === generation) return;
      statsGeneration = generation;
      try {
        const parsed = parseFaceScalars(buffer);
        if (!parsed) return;
        if (generation !== recordGeneration) return;
        // Keep the 196k samples in a packed float buffer; a JS Number[] here
        // costs several megabytes per analysis and creates avoidable GC spikes.
        const vals = new Float32Array(parsed.total);
        let count = 0;
        for (let i = 0; i < parsed.total; i++) {
          const v = parsed.scalars[i];
          if (Number.isFinite(v)) vals[count++] = v;
        }
        if (count === 0) return;
        const sorted = vals.subarray(0, count);
        sorted.sort();
        const n = sorted.length;
        const min = sorted[0];
        const max = sorted[n - 1];
        let sum = 0;
        for (let i = 0; i < n; i++) sum += sorted[i];
        const mean = sum / n;
        let varsum = 0;
        for (let i = 0; i < n; i++) varsum += (sorted[i] - mean) * (sorted[i] - mean);
        const std = Math.sqrt(varsum / n);
        const lo = sorted[Math.round((n - 1) * 0.02)];
        const med = sorted[Math.round((n - 1) * 0.5)];
        const hi = sorted[Math.round((n - 1) * 0.98)];
        // Same rule as the renderer (all algorithms share one colour window):
        // asinh only when the median face would sit in the bottom eighth of a
        // linear ramp — i.e. when the body would collapse onto one colour.
        const heavy = lo > 0 && hi > lo && (med - lo) / (hi - lo) < 0.125;
        const fmt = (x) => {
          if (!Number.isFinite(x)) return "?";
          const ax = Math.abs(x);
          return ax >= 1e-2 && ax < 1e3 ? x.toPrecision(3) : x.toExponential(2);
        };
        window.__bakeScalarStats = {
          min: fmt(min),
          max: fmt(max),
          cv: mean > 0 ? (std / mean).toFixed(2) : "?",
          lo: fmt(lo),
          hi: fmt(hi),
          mode: heavy ? "asinh" : "linear",
        };
      } catch {
        /* ignore a malformed or partial record */
      } finally {
        if (statsGeneration === generation) statsGeneration = -1;
      }
    }

    // ---------------------------------------------------------------------
    // RHGF v5 record reader
    // ---------------------------------------------------------------------
    function parseFaceScalars(buf) {
      const dv = new DataView(buf);
      if (buf.byteLength < 28) return null;
      if (dv.getUint32(0, true) !== 0x52484746) return null;
      // v5 keeps the scalars at 28 + 4·total; an older header would shift every
      // value by one float and silently produce a bogus comparison.
      if (dv.getUint32(4, true) !== 5) return null;
      const total = dv.getUint32(8, true);
      if (buf.byteLength < 28 + total * 4) return null;
      // Offset 16 is the reserved slot holding the observation height (mm).
      const standoffMm = dv.getFloat32(16, true);
      const scalars = new Float32Array(total);
      for (let i = 0; i < total; i++) scalars[i] = dv.getFloat32(28 + i * 4, true);
      return { scalars, standoffMm, total };
    }

    /**
     * Face-by-face difference between two records.
     *
     * The tolerance has to be *relative*: ‖H‖_F is ~1e-6, so an absolute test
     * could never fire and the panel would report "0 differences" for records
     * that disagree by tens of percent per face.
     */
    function scalarDiffStats(a, b, relEps = 0.05) {
      const n = Math.min(a.total, b.total);
      if (n === 0) return null;
      const rels = new Float32Array(n);
      let count = 0;
      for (let i = 0; i < n; i++) {
        const sa = a.scalars[i];
        const sb = b.scalars[i];
        if (!Number.isFinite(sa) || !Number.isFinite(sb)) continue;
        rels[count++] = Math.abs(sa - sb) / Math.max(Math.abs(sa), Math.abs(sb), 1e-300);
      }
      if (count === 0) return null;
      const sorted = rels.subarray(0, count);
      sorted.sort();
      const at = (q) => sorted[Math.min(sorted.length - 1, Math.round((sorted.length - 1) * q))];
      let over = 0;
      for (let i = 0; i < sorted.length; i++) {
        if (sorted[i] > relEps) over++;
      }
      return {
        compared: sorted.length,
        total: n,
        relEps,
        over,
        med: at(0.5),
        max: sorted[sorted.length - 1],
      };
    }

    /**
     * Reference records.
     *
     * Each density model gets its own reference. The primary pair is always the
     * same field on the same observation surface; secondary pairs are labelled
     * explicitly so a density mismatch cannot be mistaken for solver error.
     */
    const COMPARE_REFS = {
      werner: {
        name: "Werner",
        kind: "uniform density",
        asset: "assets/records/gradient_faces.bin",
        api: "/api/werner/status",
      },
      "mascon-cauchy": {
        name: "Mascon",
        kind: "Cauchy density",
        asset: "assets/records/mascon_faces.bin",
        api: "/api/mascon/status",
        recordKey: "cauchy",
      },
      "mascon-elliptic": {
        name: "Mascon",
        kind: "fractional Cauchy density",
        asset: "assets/records/mascon_elliptic_faces.bin",
        api: "/api/mascon/status",
        recordKey: "elliptic",
      },
    };
    const COMPARE_ORDER = {
      model: {
        cauchy: ["mascon-cauchy", "werner"],
        constant: ["werner", "mascon-cauchy"],
      },
      carlson: {
        cauchy: ["mascon-cauchy", "werner"],
        constant: ["werner", "mascon-cauchy"],
      },
      carlsonalpha: {
        elliptic: ["mascon-elliptic"],
        constant: ["werner"],
      },
    };

    /** Face-by-face comparison only means something at one observation height. */
    function standoffCompareNote(refMm, mineMm) {
      const rv = Number(refMm);
      const tv = Number(mineMm);
      const hasR = Number.isFinite(rv) && rv >= STANDOFF_MIN_MM && rv <= STANDOFF_MAX_MM;
      const hasT = Number.isFinite(tv) && tv >= STANDOFF_MIN_MM && tv <= STANDOFF_MAX_MM;
      if (!hasR && !hasT) return "";
      const parts = [];
      if (hasR) parts.push(`reference ${fmtMm(rv)}`);
      if (hasT) parts.push(`${cfg.name} ${fmtMm(tv)}`);
      const mismatch = hasR && hasT && Math.abs(rv - tv) > 1e-3;
      return ` · ${parts.join(" / ")}${mismatch ? " (height mismatch)" : ""}`;
    }

    /**
     * Every bake path shares the observation surface and the face indexing:
     * ‖H‖_F at each mesh vertex (`vertex + n_vertex · h`), averaged over the
     * face's three vertices. Face f is the same triangle in every record, so
     * what is left below is solver difference, not sampling.
     */
    function samplingNote() {
      return " · identical sampling: three-vertex mean of ‖H‖_F with vertex normals";
    }

    let compareBusy = false;
    // Reading two records is ~1–2 MB of scalars; only redo the comparison when
    // something it depends on moved (density model, either record, either height).
    let compareKey = "";

    /** One comparison line, or the reason it could not be computed yet. */
    async function compareAgainst(ref, refSt, mine) {
      const label = `vs ${ref.name} (${ref.kind})`;
      const refDone = Number(refSt.current) > 0 && Number(refSt.current) >= Number(refSt.total);
      if (refSt.state !== "done" && !refDone) {
        const pct = Number(refSt.total) > 0
          ? (100 * Number(refSt.current) / Number(refSt.total)).toFixed(1)
          : "?";
        return `${label}: waiting for a complete ${ref.name} record (${pct}%)`;
      }
      const [refRes, mineRes] = await Promise.all([
        fetch(`${ref.asset}?t=${Date.now()}`, { cache: "no-store" }),
        fetch(`${recordAsset()}?t=${Date.now()}`, { cache: "no-store" }),
      ]);
      if (!refRes.ok || !mineRes.ok) return `${label}: record read failed`;
      // Both records are RHGF v5: same header, same one-f32-per-face layout.
      const a = parseFaceScalars(await refRes.arrayBuffer());
      const b = parseFaceScalars(await mineRes.arrayBuffer());
      if (!a || !b) return `${label}: invalid record format`;
      const d = scalarDiffStats(b, a, 0.05);
      if (!d) return `${label}: not enough finite faces to compare`;
      const pct = (x) => `${(100 * x).toFixed(1)}%`;
      const partial = d.compared < d.total ? ` (only ${d.compared}/${d.total} comparable)` : "";
      return `${label} record difference: median ${pct(d.med)} · max ${pct(d.max)}`
        + ` · faces over ${pct(d.relEps)}: ${d.over}/${d.compared}${partial}`
        + ` · ${mine} vs ${ref.name}`
        + standoffCompareNote(a.standoffMm, b.standoffMm);
    }

    async function updateAlgorithmCompare(status) {
      if (!cfg.compare || !compareEl) return;
      const generation = recordGeneration;
      const mode = cfg.densityModes?.includes(densityMode) ? densityMode : cfg.defaultDensity;
      const order = COMPARE_ORDER[algo]?.[mode] ?? [];
      const mineTag = `${cfg.name} ${densityLabel(mode)} density`;
      compareEl.hidden = false;
      if (!status?.done) {
        compareKey = "";
        compareEl.textContent = "Once the bake completes this record is compared"
          + ` face by face against ${order.map((k) => {
            const ref = COMPARE_REFS[k];
            return `${ref.name} (${ref.kind})`;
          }).join(" and ")};`
          + " a relative difference above 5 % counts as a disagreement.";
        return;
      }
      if (order.length === 0) {
        compareEl.textContent = "No same-density reference is available for this mode.";
        return;
      }
      if (compareBusy) return;
      compareBusy = true;
      try {
        // Memoise on everything the comparison depends on: the density model,
        // the active record, and each reference record.
        const refStatuses = await Promise.all(order.map(async (k) => {
          const ref = COMPARE_REFS[k];
          if (!STATIC_DEMO) {
            const payload = await (await fetch(ref.api, { cache: "no-store" })).json();
            if (!ref.recordKey) return payload;
            const record = payload.records?.[ref.recordKey] ?? {};
            return {
              ...payload,
              state: record.done ? "done" : payload.state,
              current: record.current ?? 0,
              total: record.total ?? 0,
              standoffMm: record.standoffMm ?? 0,
            };
          }
          const res = await fetch(ref.asset, { cache: "no-store" });
          if (!res.ok) throw new Error(`failed to read ${ref.name} reference`);
          const parsed = parseFaceScalars(await res.arrayBuffer());
          if (!parsed) throw new Error(`invalid ${ref.name} reference`);
          return {
            state: "done",
            current: parsed.total,
            total: parsed.total,
            standoffMm: parsed.standoffMm,
          };
        }));
        const refSts = Object.fromEntries(order.map((k, i) => [k, refStatuses[i]]));
        if (generation !== recordGeneration) return;
        const mineKey = `${status.current ?? ""}/${status.total ?? ""}@${status.standoffMm ?? ""}`;
        const refKey = order
          .map((k, i) => `${k}:${refStatuses[i].state}:${refStatuses[i].current}/${refStatuses[i].total}@${refStatuses[i].standoffMm}`)
          .join("|");
        const key = `${algo}|${mode}|${mineKey}|${refKey}`;
        if (key === compareKey) return;
        compareKey = key;
        const lines = [];
        for (const k of order) lines.push(await compareAgainst(COMPARE_REFS[k], refSts[k], mineTag));
        if (generation !== recordGeneration) return;
        compareEl.textContent = lines.join("\n") + "\n" + samplingNote();
      } catch (e) {
        if (generation !== recordGeneration) return;
        // Drop the memo so a transient read failure is retried on the next poll.
        compareKey = "";
        compareEl.textContent = `comparison failed: ${e}`;
      } finally {
        compareBusy = false;
      }
    }

    // ---------------------------------------------------------------------
    // Controls
    // ---------------------------------------------------------------------
    async function startBake(mode) {
      const generation = ++recordGeneration;
      if (STATIC_DEMO) {
        statusEl.textContent = "Loading the precomputed record…";
        compareKey = "";
        if (wasmViewer) await pullBakeIntoWasm(wasmViewer, generation);
        await pollStatus();
        return;
      }
      const api = bakeApi;
      const density = densityMode;
      bakeBtn.disabled = true;
      resumeBtn.disabled = true;
      statusEl.textContent = mode === "resume"
        ? "Restoring from the record and continuing…"
        : `Clearing the record and recomputing at ${fmtMm(standoffMm)}…`;
      try {
        const body = { mode, standoffMm };
        // Every density-aware solver owns one record per listed model.
        if (isDensitySelectable) body.density = density;
        const s = await (await fetch(`${api}/start`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        })).json();
        if (generation !== recordGeneration) return;
        renderStatus(s);
      } catch (e) {
        if (generation !== recordGeneration) return;
        statusEl.textContent = `failed to start the bake: ${e}`;
        bakeBtn.disabled = false;
        resumeBtn.disabled = false;
      }
    }

    /** Apply a new observation height to whichever algorithm is on screen. */
    function applyStandoff(mm) {
      if (STATIC_DEMO) return;
      setStandoffUi(mm);
      // Whatever is on disk now belongs to the previous height.
      setStandoffRecordLabel(Number.NaN);
      startBake("restart");
    }

    standoffRange.addEventListener("input", () => {
      standoffDragging = true;
      setStandoffUi(posToMm(standoffRange.value));
    });
    standoffRange.addEventListener("change", () => {
      standoffDragging = false;
      standoffHoldUntil = Date.now() + 4000;
      applyStandoff(standoffMm);
    });

    async function staticStatus(signal) {
      const res = await fetch(`${recordAsset()}?t=${Date.now()}`, {
        cache: "no-store",
        signal,
      });
      if (!res.ok) throw new Error(`record read failed (${res.status})`);
      const parsed = parseFaceScalars(await res.arrayBuffer());
      if (!parsed) throw new Error("invalid RHGF v5 record");
      return {
        state: "done",
        done: true,
        message: `Static demo · precomputed ${fmtMm(parsed.standoffMm)} record`,
        percent: 100,
        current: parsed.total,
        total: parsed.total,
        standoffMm: parsed.standoffMm,
        densityMode,
      };
    }

    async function pollStatus() {
      const generation = recordGeneration;
      const api = bakeApi;
      if (statusAbort) statusAbort.abort();
      const controller = new AbortController();
      statusAbort = controller;
      try {
        const s = STATIC_DEMO
          ? await staticStatus(controller.signal)
          : await (await fetch(`${api}/status`, {
            cache: "no-store",
            signal: controller.signal,
          })).json();
        if (generation !== recordGeneration) return null;
        renderStatus(s);
        await syncRecordFromStatus(s, generation);
        return s;
      } catch (e) {
        if (controller.signal.aborted || generation !== recordGeneration) return null;
        statusEl.textContent = `status read failed: ${e}`;
        return null;
      } finally {
        if (statusAbort === controller) {
          statusAbort = null;
        }
      }
    }

    function statusRecordKey(s) {
      if (!s || (!Number(s.total) && !Number(s.current))) return "";
      return [
        algo,
        isDensitySelectable ? densityMode : "",
        recordAsset(),
        s.state ?? "",
        s.current ?? "",
        s.total ?? "",
        s.standoffMm ?? "",
      ].join("|");
    }

    async function syncRecordFromStatus(s, generation) {
      if (!wasmViewer || generation !== recordGeneration) return;
      const key = statusRecordKey(s);
      if (!key || key === lastPulledKey) return;
      await pullBakeIntoWasm(wasmViewer, generation, key, s.done === true);
    }

    async function pullBakeIntoWasm(
      wasm,
      generation = recordGeneration,
      key = "",
      withStats = false,
    ) {
      if (pullAbort && pullGeneration === generation) return;
      if (pullAbort) pullAbort.abort();
      const controller = new AbortController();
      pullAbort = controller;
      pullGeneration = generation;
      const asset = recordAsset();
      try {
        const bakeRes = await fetch(`${asset}?t=${Date.now()}`, {
          cache: "no-store",
          signal: controller.signal,
        });
        if (!bakeRes.ok) return;
        const bakeBytes = new Uint8Array(await bakeRes.arrayBuffer());
        if (generation !== recordGeneration) return;
        if (bakeBytes.byteLength >= 28) {
          wasm.push_bake_update(bakeBytes);
          if (key) lastPulledKey = key;
          if (withStats) await refreshBakeScalarStats(bakeBytes.buffer);
        }
      } catch {
        /* ignore the transient read while the writer truncates the record */
      } finally {
        if (pullAbort === controller) {
          pullAbort = null;
          pullGeneration = -1;
        }
      }
    }

    bakeBtn.addEventListener("click", () => startBake("restart"));
    resumeBtn.addEventListener("click", () => startBake("resume"));
    reloadBtn.addEventListener("click", async () => {
      if (!wasmViewer) return;
      reloadBtn.disabled = true;
      compareKey = "";
      window.__bakeScalarStats = null;
      statusEl.textContent = "Reloading the current record colours…";
      try {
        await pullBakeIntoWasm(wasmViewer, recordGeneration, "", true);
        await pollStatus();
      } finally {
        reloadBtn.disabled = false;
      }
    });
    densBtn.addEventListener("click", () => {
      densityMode = nextDensityMode();
      recordGeneration++;
      applyAlgoLabels();
      compareKey = "";
      statusEl.textContent = `Switched to ${densityLabel(densityMode)} density, recomputing…`;
      startBake("restart");
    });

    applyAlgoLabels();
    if (!STATIC_DEMO) {
      const pollLoop = async () => {
        if (!document.hidden) await pollStatus();
        setTimeout(pollLoop, 1000);
      };
      setTimeout(pollLoop, 1000);
    }
    const initialStatus = await pollStatus();

    if (!navigator.gpu) {
      show("WebGPU is required (navigator.gpu is unavailable in this browser).");
    } else {
      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) {
          show("No WebGPU adapter: open this page in a local Chrome or Edge build with WebGPU enabled.");
        } else {
          // Observation height for this session: an explicit ?standoff= wins,
          // otherwise the height the record on disk was baked at (the status
          // poll adopts it a moment later), otherwise the shared default.
          const urlStandoff = Number(new URLSearchParams(location.search).get("standoff"));
          if (
            Number.isFinite(urlStandoff)
            && urlStandoff >= STANDOFF_MIN_MM
            && urlStandoff <= STANDOFF_MAX_MM
          ) {
            setStandoffUi(urlStandoff);
          }
          const wasm = await import("./pkg/ryugu_cauchy_gravity.js");
          await wasm.default({ module_or_path: "./pkg/ryugu_cauchy_gravity_bg.wasm" });
          wasmViewer = wasm;
          let bakeBytes = new Uint8Array(28);
          try {
            const bakeRes = await fetch(recordAsset(), { cache: "no-store" });
            if (bakeRes.ok) bakeBytes = new Uint8Array(await bakeRes.arrayBuffer());
          } catch {
            /* start gray; the bake may create the file */
          }
          wasm.run_with_bake(bakeBytes);
          lastPulledKey = statusRecordKey(initialStatus);
          if (initialStatus?.done) await refreshBakeScalarStats(bakeBytes.buffer);
        }
      } catch (e) {
        show(String(e?.stack || e));
      }
    }
  </script>
</body>
</html>
