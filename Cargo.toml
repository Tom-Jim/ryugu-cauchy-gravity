[package]
name = "ryugu_cauchy_gravity"
version = "0.1.0"
edition = "2024"
description = "Bevy + WebGPU viewer for per-face gravity-gradient records of asteroid (162173) Ryugu"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Tom-Jim/ryugu-cauchy-gravity"
homepage = "https://github.com/Tom-Jim/ryugu-cauchy-gravity"
keywords = ["gravity-gradient", "polyhedral", "asteroid", "ryugu", "webgpu"]
categories = ["science", "graphics", "wasm"]

[lib]
path = "src/viewer/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d", "webgpu"] }
bevy_panorbit_camera = "0.35"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Performance"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
