[package]
name = "ryugu_h_cal"
version = "0.1.0"
edition = "2024"
description = "Minimal Bevy WebGPU viewer: asteroid Ryugu only"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d", "webgpu"] }
bevy_panorbit_camera = "0.35"
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
